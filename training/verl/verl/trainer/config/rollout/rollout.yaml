# Target class for this configuration
_target_: verl.workers.config.RolloutConfig

# actor_rollout_ref.rollout.name: hf/vllm/sglang/trtllm. The default value will be removed in the future
name: ???

# sync: LLM, async: AsyncLLM
mode: async

# Number of nodes for standalone rollout server, must be > 0 in one-step-off/fully async training.
nnodes: 0

# Number of GPUs per node for rollout server.
n_gpus_per_node: ${oc.select:trainer.n_gpus_per_node,8}

# Sampling temperature for rollout.
temperature: 1.0

# Top-k sampling parameter. -1 for vLLM rollout, 0 for HF rollout.
top_k: -1

# Top-p sampling parameter. Default 1.0.
top_p: 1

# typically the same as data max prompt length
# same as data.max_prompt_length if it exists
prompt_length: ${oc.select:data.max_prompt_length,512}

# typically the same as data max response length
# same as data.max_response_length if it exists
response_length: ${oc.select:data.max_response_length,512}

# for vllm rollout
# Rollout model parameters type. Align with actor model's FSDP/Megatron type.
dtype: bfloat16

# Fraction of GPU memory used by vLLM/SGLang/TRTLLM for KV cache.
gpu_memory_utilization: 0.5

# Whether to ignore EOS and continue generating after EOS is hit.
ignore_eos: False

# Whether to disable CUDA graph. Default False to best performance.
enforce_eager: False

# batch size of cudagraph to capture. Require enforce_eager: False to use this option
# Since cudagraph in inference engine can not be offloaded during update policy,
# you can use smaller batch size to save memory used in cuda graph, eg: [1 ,2, 4, 8, 16, 32]
# supported engines: vllm
cudagraph_capture_sizes: null

# Whether to free engine KVCache after generation.
free_cache_engine: True

# TP size for rollout. Not effective for hf
tensor_model_parallel_size: 2

# DP size for rollout
data_parallel_size: 1

# EP size for rollout
# For MoE models in vllm, EP=1 refers to ETP parallel in fused_moe with TP*DP weight splits,
# EP>1 (should satisfy EP=TP*DP) refers to EP parallel in fused_moe
expert_parallel_size: 1

# PP size for rollout.
pipeline_model_parallel_size: 1

# max number of tokens in a batch
max_num_batched_tokens: 8192

# max length for rollout
max_model_len: null

# max length of sequences
max_num_seqs: 1024

# may get higher throughput when set to True. When activated, Please increase max_num_batched_tokens or decrease max_model_len.
enable_chunked_prefill: True

# Prefix caching kv-cache blocks is a popular optimization in LLM inference to avoid redundant prompt computations.
enable_prefix_caching: True

# logprobs mode for rollout logprobs
logprobs_mode: processed_logprobs

# scheduling policy for vllm rollout
scheduling_policy: fcfs

# Which loader to use for rollout model weights: dummy, hf, megatron, etc.
# safetensors (for huge model, and set use_shm=True); dummy: randomly init model weight
load_format: dummy

# for huge model, layered summon can save memory (prevent OOM) but make it slower
layered_summon: False

# [Will be deprecated, use log_prob_micro_batch_size_per_gpu] The batch size for one forward pass in the computation of log_prob. Global batch size.
log_prob_micro_batch_size: null

# The batch size for one forward pass in the computation of log_prob. Local batch size per GPU.
log_prob_micro_batch_size_per_gpu: null

# enable dynamic batch size (sequence packing) for log_prob computation
# same as actor_rollout_ref.actor.use_dynamic_bsz if it exists, otherwise false
log_prob_use_dynamic_bsz: ${oc.select:actor_rollout_ref.actor.use_dynamic_bsz,false}

# max token length for log_prob computation
# same as actor_rollout_ref.actor.ppo_max_token_len_per_gpu if it exists, otherwise 16384
log_prob_max_token_len_per_gpu: ${oc.select:actor_rollout_ref.actor.ppo_max_token_len_per_gpu,16384}

# disable logging statistics
disable_log_stats: True

# for hf rollout
# Whether to sample during training rollout. False uses greedy sampling.
do_sample: True

# number of responses (i.e. num sample times). > 1 for grpo
n: 1

# The over_sample_rate parameter controls the early termination threshold for training rollouts,
# where the system will abort remaining requests when (1 - over_sample_rate) * total_requests completions are reached.
over_sample_rate: 0

# Whether to wake up inference engine in multi-stage for SGLang
# to reduce peak memory during training-rollout transition.
# This is only effective for SGLang rollout.
multi_stage_wake_up: false

# Extra inference engine arguments (vllm, sglang, trtllm), please refer vllm/sglang/trtllm official doc for detail
engine_kwargs:

  # vllm engine config
  vllm: {}

  # sglang engine config
  sglang: {}

  # trtllm engine config
  trtllm: {}

# Sampling parameters used during validation.
val_kwargs:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.SamplingConfig

  # sampling parameters for validation
  # Top-k sampling parameter. -1 for vLLM rollout, 0 for HF rollout.
  top_k: -1

  # Top-p sampling parameter. Default 1.0.
  top_p: 1.0

  # Sampling temperature for rollout.
  temperature: 0

  # whether to repeat n times for validation
  n: 1

  # Whether to sample during training rollout. False uses greedy sampling.
  do_sample: False

# Controlled exploration via entropy-aware token dropout at rollout time.
# When `enable` is false (default), rollout behavior is bitwise-identical to baseline.
exploration:

  # Required for Hydra dataclass instantiation.
  _target_: verl.workers.config.ExplorationConfig

  # Master switch. false = exactly baseline behavior, zero overhead.
  enable: false

  # Of `rollout.n` responses per prompt, the first k use exploration sampling;
  # the rest are unperturbed anchor rollouts. Must be <= rollout.n.
  k_explore: 4

  # Trigger selector:
  #   "high" -> perturb where max_prob > top_prob_threshold.
  #   "band" -> perturb where tau_low < max_prob < tau_high.
  trigger_mode: "high"

  # Trigger threshold on max-probability. Positions where top1 prob > tau are
  # candidates for perturbation. Used when trigger_mode == "high". Range (0, 1).
  top_prob_threshold: 0.9

  # Lower / upper edges of the medium-confidence trigger band. Used when
  # trigger_mode == "band". Must satisfy 0 <= tau_low < tau_high <= 1.
  tau_low: 0.3
  tau_high: 0.7

  # Per triggered position, independent probability of actually masking. Range [0, 1].
  perturb_prob: 0.3

  # How many of the top tokens to mask (1 = just the argmax).
  drop_top_k: 1

  # Skip the first N tokens of the response (preserve format opening).
  min_position: 8

  # Cap total perturbations per sequence (prevents runaway derail).
  max_perturbations_per_seq: 32

  # If true, only perturb tokens generated inside <think>...</think>.
  # Requires the token IDs below to match the model's tokenizer.
  restrict_to_think_region: true

  # Token IDs for <think> and </think>. Defaults are for Qwen3-VL-4B-Instruct.
  # Update these if switching models.
  think_open_token_id: 151667
  think_close_token_id: 151668

  # RNG seed (null = nondeterministic). Seeding yields reproducible
  # exploration trajectories for debugging.
  seed: null

  # Per-prompt Bernoulli gate. Each prompt in the batch is independently
  # selected for exploration with this probability. Within selected prompts,
  # the first k_explore rollouts still carry the rvrl_exploration flag.
  # 1.0 = every prompt eligible.
  prompt_exploration_prob: 1.0

  # When true, every triggered position (top1_prob > tau) is dropped and
  # `perturb_prob` is ignored. When false, the Bernoulli(perturb_prob) gate
  # applies per position.
  deterministic: false

  # Nominal switch for excluding forced-resample positions from the
  # policy-gradient aggregation. It is not read anywhere: the loss removes
  # those positions whenever the drop mask is present, so masking is
  # unconditional.
  mask_from_loss: false

  # Accepted but not read: the per-prompt Bernoulli draw is unseeded.
  selection_seed: null

  # Two-wave variance-targeted exploration. When true, each TRAINING prompt's n
  # rollouts split into wave-1 anchors [0, n_anchor), which are never explored,
  # and wave-2 [n_anchor, n); all of wave-2 is explored iff the wave-1 reward
  # variance is low, i.e. the group is degenerate and carries no GRPO gradient.
  # Validation never triggers two-wave.
  two_wave_enable: false

  # wave-1 share of rollout.n. n_anchor = clamp(round(n*anchor_fraction), 1, n-1),
  # so wave-1 and wave-2 are each always non-empty. n=8, 0.5 => 4 anchor / 4 cond.
  anchor_fraction: 0.5

  # explore wave-2 iff wave-1 variance <= this. 0.0 => only when all wave-1
  # scores are identical (fully degenerate group: all-correct OR all-wrong).
  variance_threshold: 0.0

  # per-rollout scalar used for the wave-1 variance/mean: "accuracy" reads
  # reward_extra_info["accuracy"]; "reward" reads the blended reward_score.
  variance_metric: "accuracy"

  # explore wave-2 only if wave-1 mean <= this (AND variance is low). 1.0 =>
  # explore regardless of mean, so all-correct groups are eligible too. Set
  # below 1.0 to skip all-correct groups.
  explore_max_mean: 1.0

  # Two-wave duty cycle. false => every prompt runs the two-wave strategy.
  # true => the STRATEGY runs only on prompts whose ordinal satisfies
  # (ordinal % period == phase); all other prompts take a plain-GRPO path with
  # no wave split and no exploration stamp.
  #
  # The toggle gates the strategy, not the exploration: inside a strategy-on
  # prompt the explore decision is still driven by wave-1 variance, so a
  # strategy-on prompt whose wave-1 has high variance explores nothing.
  #
  # Requires two_wave_enable=true, and requires the rollouter to stamp
  # meta_info["rvrl_prompt_ordinal"]; the dispatcher raises if it is missing.
  two_wave_toggle_enable: false

  # Strategy runs on 1 of every N prompts. 1 => every prompt. 2 => alternate.
  two_wave_toggle_period: 2

  # Which residue is ON: strategy runs iff (ordinal % period == phase % period).
  # Taken modulo period, so any non-negative value is valid. 1 => the first
  # prompt of a run (ordinal 1) runs the strategy.
  two_wave_toggle_phase: 1

  # ---- drop analysis ----------------------------------------------------
  # The aggregate drop statistics (rvrl/drop/logp_mean,
  # forced_logp_delta_mean, mass_mean, ...) are collected unconditionally and
  # need no flag. These keys control the expensive per-drop record.
  #
  # Record each drop: position, dropped token id, its log-prob, the surviving
  # runner-up, entropy. Costs one host sync per apply() over the perturbed rows.
  # True when the prompt is prefilled with <think> (VERL_THINK_PREFILL=1). With prefill on
  # AND restrict_to_think_region on, leaving this false makes exploration a permanent no-op:
  # the LP waits for an opening tag the model never emits. The LP defaults it from the env
  # var, so false here still behaves correctly; set it only to force a value.
  think_prefilled: false
  record_details: false
  # Full-vocab entropy at each dropped position. Only read when record_details.
  record_entropy: true
  # Pre-drop top-N candidates kept per drop. vLLM returns log-probs computed
  # from the MASKED logits, so the sampled token's ORIGINAL log-prob cannot be
  # recovered without this. 0 disables. Only read when record_details.
  detail_topn: 8
  # Per-request cap on recorded drops, so one pathological rollout cannot
  # dominate a dump.
  detail_max_per_request: 512
  # Directory for the per-drop JSONL dump, written by the trainer once per
  # param version to <dir>/<experiment_name>/drops_<pv>.jsonl. Empty => no dump.
  drop_dump_dir: ""
  # Cap on rows written per param version. Coverage is reported as
  # rvrl/drop/dump_coverage so a truncated dump is never mistaken for complete.
  drop_dump_max_rows: 2000

  # Per-worker drop trace: the dropped token and the token the sampler chose
  # in its place. Written directly by the vLLM worker process, because the
  # _DROPPED_DETAILS side-channel cannot cross the worker/server process
  # boundary. "" disables.
  drop_trace_dir: ""

  # Per-worker row cap. The trace stops there; rvrl/* counts are unaffected.
  drop_trace_max_rows: 20000

  # Entropy instrumentation. Observation only: no gate, no gradient, no change
  # to which tokens are dropped. Cost at stride 1 is one logsumexp plus one
  # multiply-reduce over the B x V logits, on top of a softmax the processor
  # already computes.
  measure_entropy: true

  # Measure every Nth decode step. 1 = every step.
  entropy_measure_stride: 1

  # After each drop, keep measuring entropy for this many further tokens of the
  # sequence. 0 disables.
  entropy_post_drop_window: 16

  # Cap on per-rollout entropy rows written to drop_trace_dir. Held separate
  # from drop_trace_max_rows so a saturated drop trace cannot starve them.
  entropy_seq_trace_max_rows: 40000

  # Token-class filter: restrict drops to tokens that have a real alternative.
  # Excludes whitespace-only, punctuation-only, bare-digit and special/control
  # tokens.
  skip_special_tokens: true
  skip_whitespace_punct: false
  skip_digit_tokens: false
  # Stricter: require the dropped token to start a word. Removes many
  # candidates, so enable it deliberately.
  skip_subword_continuation: false

  # Snapshot LP counters into the drop trace every N apply() calls, so they
  # reach disk independently of the Ray metric path. 0 disables.
  counter_snapshot_every: 2000

# Multi-turn tool config.
multi_turn:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.MultiTurnConfig

  # set to True for multi-turn tool tasks; should set rollout.name to sglang as well
  enable: False

  # null for no limit (default max_length // 3)
  max_assistant_turns: null

  # YAML config for stateful tools that subclass ``BaseTool``.
  # Use this when a tool needs per-trajectory state, async ``create``/``release``
  # lifecycle hooks, or custom rewards.
  # null disables this code path.
  tool_config_path: null

  # Path to a Python file with ``@function_tool``-decorated functions, loaded
  # once per ``AgentLoopWorker``. Use this for stateless tools where the
  # OpenAI-compatible JSON schema can be inferred from the function signature
  # and Google-style docstring. Coexists with ``tool_config_path``; name
  # collisions across the two raise an error.
  # null disables this code path.
  function_tool_path: null

  # null for no limit (default max_length // 3)
  max_user_turns: null

  # max parallel call for tools in single turn
  max_parallel_calls: 1

  # max length of tool response
  max_tool_response_length: 256

  # truncate side of tool response: left, middle, right
  tool_response_truncate_side: middle

  # - When set to True, the model's default chat template is used for multi-turn rollout, which typically matches production behavior.
  # - When set to False, the token ids recorded for training are used instead; unlike the default chat template, these always include the model's full output,
  #   which may contain additional content such as reasoning content. This maintains the consistency between training and rollout, but it will lead to longer prompts.
  use_inference_chat_template: False

  # Tokenization is performed turn by turn and the resulting token ids are concatenated to form the full conversation.
  # To ensure this matches the result of tokenizing the entire conversation at once, a sanity check is run at the end of each multi-turn rollout to compare the two sets of token ids.
  # Some models are known to produce different tokenization results when tokenizing turn by turn vs. all at once. aThis behavior has already been validated for them.
  # To reduce excessive warnings, you can turn off the sanity check for these models if you are using their default chat template:
  # Qwen/QwQ-32B, Qwen/Qwen3-xxB
  # - disable: disable tokenization sanity check
  # - strict: enable strict tokenization sanity check (default)
  # - ignore_strippable: ignore strippable tokens when checking tokenization sanity
  tokenization_sanity_check_mode: strict

  # Format of the multi-turn rollout. Options: hermes, llama3_json, ...
  format: hermes

  # Number of repeat rollouts for each sample
  num_repeat_rollouts: null

# support logging rollout prob for debugging purpose
# "Truncated importance sampling" requires rollout log probs, set to True when turning on Truncated importance sampling
calculate_log_probs: False

# [Experimental] agent loop based rollout configs
agent:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.AgentLoopConfig

  # Number of agent loop workers
  num_workers: 8

  # default agent loop to use if `agent_name` not set in RL dataset
  default_agent_loop: single_turn_agent

  # custom agent loop config path, which should contain list of configs to initialize AgentLoop instances.
  # https://hydra.cc/docs/advanced/instantiate_objects/overview/
  #
  # - name: react_agent
  #   _target_: recipe.langgraph_agent.react_agent_loop.ReactAgentLoop
  #   tools: ["get_current_temperature"]
  # - name: math_expression
  #   _target_: recipe.langgraph_agent.example.math_expression.MathExpressionReactAgentLoop
  #   min_terms: 2
  #   max_terms: 6
  agent_loop_config_path: null

  # custom async server configs
  custom_async_server:

    # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
    _target_: verl.workers.config.CustomAsyncServerConfig

    # Path to the custom async server implementation
    path: null

    # Class name of the custom async server class (e.g. AsyncvLLMServer)
    name: null

# Checkpoint Engine config for update weights from trainer to rollout
checkpoint_engine:

  # Target class for checkpoint engine config
  _target_: verl.workers.config.CheckpointEngineConfig

  # Backend for checkpoint engine: naive, nccl, nixl, hccl
  backend: naive

  # Specifies the tensor bucket size (in megabytes) for batch weight updates during rollout operations.
  # This parameter controls the maximum payload size for a single weight update request.
  # Reference: https://github.com/verl-project/verl/pull/2418
  # Currently only supported in SGLang rollout implementations
  # Larger values may improve throughput but increase memory overhead
  # Detailed performance comparison:
  # https://github.com/zhaochenyang20/Awesome-ML-SYS-Tutorial/issues/169#issuecomment-3070686720
  # Default value (512MB) is optimized for typical GPU memory configurations
  # For the best performance of `rebuild_cuda_tensor`, it is recommended to:
  # 1. Enable `RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES`
  # 2. Manually set `CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7`
  # when using Tensor Parallelism (TP) >= 8.
  update_weights_bucket_megabytes: 2048

  # Additional keyword arguments to pass to the checkpoint engine constructor
  engine_kwargs: {}

  # If set, this Python module is imported on every worker process before the
  # backend is instantiated, allowing custom backends to register themselves
  # in CheckpointEngineRegistry.
  custom_backend_module: null

# trace rollout data
trace:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.TraceConfig

  # Project name for experiment tracking (e.g., wandb)
  project_name: ${oc.select:trainer.project_name,null}

  # Experiment name for run identification in tracking tools
  experiment_name: ${oc.select:trainer.experiment_name,null}

  # trace backend, support mlflow, weave
  backend: null

  # whether translate token id to text in output
  token2text: False

  # Maximum number of unique samples to trace per agent worker per training step.
  # If null, all samples are traced. If set to N, each agent loop worker will randomly
  # select N unique samples to trace (including all their rollouts for GRPO).
  # Total traces per step = max_samples_per_step_per_worker * num_workers * n_rollouts_per_sample
  max_samples_per_step_per_worker: null

# rollout skip config (load/dump rollout data)
skip:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.SkipConfig

  # When enabled (True), the trainer will attempt to load previously generated rollout data from the specified directory instead of computing new rollouts.
  # If no cached data is found or loading fails, new rollouts will be generated and automatically saved.
  # This feature is useful for debugging or when you want to reuse computation results across multiple runs.
  enable: False

  # Default ~/.verl/rollout_dump (expanduser+resolve at runtime). Ray/multi-node: prefer absolute dump_dir (relative paths follow each process cwd).
  # Avoid /tmp/ray/session* (ephemeral).
  dump_dir: "~/.verl/rollout_dump"

  # Number of training steps (from start) for which dump/load is active. Steps with train_step <= max_dump_step are "dump steps" (try load first, then generate and dump if missing).
  max_dump_step: 1

  # Action when beyond dump steps (gen_step > max_dump_step):
  # - "cache": If dumped data exists for current step, use it; otherwise generate and dump.
  # - "repeat": Reuse dumped data in a round-robin over the first max_dump_step steps.
  # - "repeat_last": Reuse the last dumped step's data.
  action: "cache"

# Whether to skip tokenizer initialization for rollout engine
# When enabled (True), the rollout assume token in token out for generation
skip_tokenizer_init: True

# Whether to enable rollout routing replay for MoE models
# When enabled (True), the rollout will record the routing decisions.
enable_rollout_routing_replay: False


# profile the rollout model in `generate_sequence`
profiler:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.utils.profiler.ProfilerConfig

  # profiler tool, default same as profiler.tool in global config
  # choices: npu, torch
  tool: ${oc.select:global_profiler.tool,null}

  # whether enable profile on rollout
  enable: ${oc.select:actor_rollout_ref.actor.profiler.enable,false}

  # Whether to profile all ranks.
  all_ranks: ${oc.select:actor_rollout_ref.actor.profiler.all_ranks,false}

  # The ranks that will be profiled. [] or [0,1,...]
  ranks: ${oc.select:actor_rollout_ref.actor.profiler.ranks,[]}

  # profile results saving path
  save_path: ${oc.select:global_profiler.save_path,null}

  # specific tool config
  tool_config:

    # npu config
    npu:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.NPUToolConfig

      # Contents to profile, can be empty
      # options: npu, cpu, memory, shapes, module, stack
      contents: ${oc.select:actor_rollout_ref.actor.profiler.tool_config.npu.contents,[]}

      # Collection level, optional values: level_none, level0, level1, level2.
      level: ${oc.select:actor_rollout_ref.actor.profiler.tool_config.npu.level,level0}

      # Whether to automatically parse the data.
      analysis: ${oc.select:actor_rollout_ref.actor.profiler.tool_config.npu.analysis,false}

      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: ${oc.select:actor_rollout_ref.actor.profiler.tool_config.npu.discrete,false}

    # torch profiler config
    torch:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.TorchProfilerToolConfig

      # Contents to profile, can be empty
      # options: cuda, cpu, memory, shapes, stack
      contents: ${oc.select:actor_rollout_ref.actor.profiler.tool_config.torch.contents,[]}

      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: ${oc.select:actor_rollout_ref.actor.profiler.tool_config.torch.discrete,false}

    # msprobe precision debugger config
    precision_debugger:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.PrecisionDebuggerToolConfig

      # Path to msprobe config json
      config_path: ${oc.select:actor_rollout_ref.actor.profiler.tool_config.precision_debugger.config_path,${oc.select:global_profiler.global_tool_config.precision_debugger.config_path,null}}

      # Deprecated and ignored. Use global_profiler.steps.
      steps: null

      # Profile stages
      # Supported stages: actor_update, actor_compute_log_prob, ref_compute_log_prob,
      # compute_values, critic_update, compute_rm_score
      stages: ${oc.select:actor_rollout_ref.actor.profiler.tool_config.precision_debugger.stages,${oc.select:global_profiler.global_tool_config.precision_debugger.stages,null}}

      # Whether to fail on unknown stage or missing msprobe
      strict: ${oc.select:actor_rollout_ref.actor.profiler.tool_config.precision_debugger.strict,${oc.select:global_profiler.global_tool_config.precision_debugger.strict,False}}

# prometheus configuration for vllm/sglang server mode
prometheus:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.PrometheusConfig

  # whether enable prometheus on server mode rollout
  enable: false

  # Port number that Prometheus listens on, default is 9090
  port: 9090

  # Path to Prometheus configuration file
  file: /tmp/ray/session_latest/metrics/prometheus/prometheus.yml

  # Specify served_model_name to avoid displaying overly long model paths in Grafana
  served_model_name: ${oc.select:actor_rollout_ref.model.path,null}

# type of quantization in vllm, currently support fp8 and torchao
quantization: null

# extra quantization information serialized in a config file, e.g. torchao_config.json
quantization_config_file: null

# MTP configuration, reuse model configuration
mtp: ${oc.select:actor_rollout_ref.model.mtp, null}

# QAT configuration (inherited from actor's engine config)
qat: ${oc.select:actor_rollout_ref.actor.fsdp_config.qat,${oc.select:actor_rollout_ref.actor.megatron.qat,null}}

# Prefill-Decode disaggregation (SGLang only; keep rollout.name=sglang and toggle enabled=True).
disaggregation:

  # Master switch for PD disaggregation.
  enabled: False

  # Number of prefill replicas (each uses tensor_model_parallel_size GPUs).
  prefill_replicas: 1

  # Number of decode replicas.
  decode_replicas: 1

  # Decode TP override; null = same as tensor_model_parallel_size.
  decode_tensor_model_parallel_size: null

  # KV cache transport: nixl | mooncake | ascend | mori | fake.
  transfer_backend: nixl

  # Bootstrap server port on prefill side; null = auto-assign.
  bootstrap_port: null

  # InfiniBand device (required for mooncake over RDMA).
  ib_device: null
